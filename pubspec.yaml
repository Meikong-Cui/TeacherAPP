name: teacher_app
description: "语亦丰儿童康复教育系统 - 教师端 App（Flutter）。含上下班签到（1km 围栏）与预留的 AI 教案生成接口。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  geolocator: ^12.0.0
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  pdf: ^3.10.7
  printing: ^5.12.0
  flutter_local_notifications: ^17.2.0
  flutter_tts: ^4.0.0
  record: ^5.1.0
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # record 5.x 家族上游配对缺陷：record_linux 0.7.2 未实现 interface 1.6.0 的
  # startStream / hasPermission(request)（pub 依其过宽的 ^1.0.2 约束误判兼容）。
  # 升到 1.3.1（声明 interface ^1.5.0、补齐两成员），仅影响 Linux 桌面端编译，
  # record 本体保持 5.2.1，Android/iOS 行为不变。
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/hearing_symbols/
